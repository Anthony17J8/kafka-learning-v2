global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kafka-brokers
    static_configs:
      - targets:
          - kafka-1:9404
          - kafka-2:9404
          - kafka-3:9404
        labels:
          cluster: local-cluster
