# Одиночный брокер в KRaft. Модули 0-5.
#
#   cd docker
#   docker compose -f compose.single.yml up -d
#
# Порты:
#   localhost:9092  — клиенты с хоста (listener EXTERNAL)
#   kafka:9094      — клиенты внутри compose-сети (listener INTERNAL)
#   kafka:9093      — Raft (listener CONTROLLER)
name: kafka-learning-single

services:
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      # Адрес в advertised должен быть резолвим у КЛИЕНТА, а не у брокера.
      # Отсюда два разных адреса: kafka для контейнеров, localhost для хоста.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ${CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # KAFKA_OPTS= — см. комментарий в compose.cluster.yml
      test: ["CMD-SHELL", "KAFKA_OPTS= /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      start_period: 45s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFKA_UI_VERSION:-latest}
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: single
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka-data:

networks:
  default:
    name: kafka-learning
