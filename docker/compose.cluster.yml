# Кластер из 3 нод в KRaft (combined-роли: broker + controller).
# Нужен для модулей 6-8, 11-15.
#
#   cd docker
#   docker compose -f compose.cluster.yml up -d
#
# Порты:
#   localhost:19092 / 29092 / 39092  — клиенты с хоста (listener EXTERNAL)
#   kafka-N:9094                     — межброкерный трафик (listener INTERNAL)
#   kafka-N:9093                     — Raft-кворум (listener CONTROLLER)
#
# Внутренний порт одинаков у всех нод, внешние разные — так конфигурация
# симметрична и healthcheck один для всех.
name: kafka-learning-cluster

x-kafka-common: &kafka-common
  image: apache/kafka:${KAFKA_VERSION:-4.3.1}
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    # Модуль 6: переключите в "true" и воспроизведите потерю данных.
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    CLUSTER_ID: ${CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
  healthcheck:
    # KAFKA_OPTS= гасим намеренно. kafka-run-class.sh передаёт эту переменную
    # ЛЮБОМУ java-процессу в контейнере, включая эту утилиту. Если в ней
    # прописан javaagent, утилита попытается занять уже занятый порт и умрёт,
    # а healthcheck будет вечно красным при полностью живом брокере.
    test: ["CMD-SHELL", "KAFKA_OPTS= /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1"]
    interval: 15s
    timeout: 30s
    start_period: 90s
    retries: 10

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    ports: ["19092:19092", "19404:9404"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9094,EXTERNAL://localhost:19092
      KAFKA_BROKER_RACK: rack-a
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    ports: ["29092:29092", "29404:9404"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9094,EXTERNAL://localhost:29092
      KAFKA_BROKER_RACK: rack-b
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    ports: ["39092:39092", "39404:9404"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:39092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9094,EXTERNAL://localhost:39092
      KAFKA_BROKER_RACK: rack-c
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  schema-registry:
    # Сверьтесь с версией Confluent Platform, совместимой с вашей Kafka,
    # прежде чем пинить конкретный тег.
    image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION:-latest}
    container_name: schema-registry
    ports: ["8081:8081"]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9094,PLAINTEXT://kafka-2:9094,PLAINTEXT://kafka-3:9094
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:${KAFKA_UI_VERSION:-latest}
    container_name: kafka-ui
    ports: ["8080:8080"]
    depends_on:
      kafka-1: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9094,kafka-2:9094,kafka-3:9094
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

networks:
  default:
    name: kafka-learning
